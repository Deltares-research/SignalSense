[project]
authors = [{name = "Roeland Nieboer", email = "roeland.nieboer@deltares.nl"}]
dependencies = []
name = "SignalSense"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
signalsense = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = ">=2.5.3,<3"
pandas = ">=3.0.6,<4"
scipy = ">=1.18.1,<2"
matplotlib = ">=3.11.2,<4"
python-dotenv = ">=1.2.4,<2"
